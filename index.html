    function setAudioCategory(category, btn) {
      currentAudioCategory = category;
      document.querySelectorAll('.audio-tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

    function getFilteredTrackPool() {
      if (!currentAudioCategory || currentAudioCategory === "ALL") return permanentAudioLibrary;
      return permanentAudioLibrary.filter(t => t.category === currentAudioCategory);
    }

    function renderPlaylistItems() {
      const container = document.getElementById('playlist-items-container');
      if (!container) return;
      container.innerHTML = '';
      const filtered = getFilteredTrackPool();
      const unlocked = isMemberUnlocked();

      filtered.forEach((track, index) => {
        const isTrackLocked = track.isLocked && !unlocked;
        const item = document.createElement('div');
        item.className = `playlist-item ${index === activeTrackIndex ? 'active' : ''}`;
        let statusBadge = index === activeTrackIndex ? '▶ Playing' : '▶ Play';
        if (isTrackLocked) statusBadge = '🔒 Members Only';

        item.innerHTML = `
          <div>
            <div class="track-title" style="font-size: 1rem;">${track.title}</div>
            <div style="font-size: 0.78rem; color: var(--text-muted);">${isTrackLocked ? '🔒 ' + track.category : track.category}</div>
          </div>
          <span class="track-duration" style="${isTrackLocked ? 'color: var(--gold-accent); font-weight:800;' : ''} font-size: 0.88rem;">${statusBadge}</span>
        `;
        item.onclick = () => playTrackByIndex(index);
        container.appendChild(item);
      });
    }

    function playTrackByIndex(index) {
      const filtered = getFilteredTrackPool();
      if (index < 0 || index >= filtered.length) return;
      const track = filtered[index];
      if (track.isLocked && !isMemberUnlocked()) { openMembershipModal(); return; }

      activeTrackIndex = index;
      document.getElementById('current-title').innerText = track.title;
      document.getElementById('current-category').innerText = track.category;
      const audio = document.getElementById('main-audio');
      audio.src = track.src;
      audio.play().catch(() => {});
      renderPlaylistItems();
    }

    function toggleContinuousPlay() {
      isContinuousPlay = !isContinuousPlay;
      const btn = document.getElementById('btn-continuous');
      const lbl = document.getElementById('lbl-continuous');
      btn.classList.toggle('active', isContinuousPlay);
      lbl.innerText = isContinuousPlay ? "Continuous: ON" : "Continuous: OFF";
    }

    function toggleRandomPlay() {
      isRandomPlay = !isRandomPlay;
      const btn = document.getElementById('btn-random');
      const lbl = document.getElementById('lbl-random');
      btn.classList.toggle('active', isRandomPlay);
      lbl.innerText = isRandomPlay ? "Random: ON" : "Random: OFF";
    }

    function playNextTrack() {
      const filtered = getFilteredTrackPool();
      if (filtered.length <= 1) return;
      if (isRandomPlay) {
        let randomIndex;
        do { randomIndex = Math.floor(Math.random() * filtered.length); } while (randomIndex === activeTrackIndex);
        playTrackByIndex(randomIndex);
      } else {
        let nextIndex = activeTrackIndex + 1;
        if (nextIndex >= filtered.length) nextIndex = 0;
        playTrackByIndex(nextIndex);
      }
    }

    function renderPictureList(containerId, list, activeIndex, onSelectCallback) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = '';
      const unlocked = isMemberUnlocked();

      list.forEach((item, index) => {
        const row = document.createElement('div');
        const isCurrentlyLocked = item.isLocked && !unlocked;
        row.className = `pic-queue-item ${index === activeIndex ? 'active' : ''}`;
        row.onclick = () => onSelectCallback(index);

        const lockBadge = isCurrentlyLocked 
          ? `<span style="font-size: 0.76rem; color: var(--gold-accent); font-weight: 800;">🔒 Locked</span>` 
          : `<span style="font-size: 0.76rem; color: var(--emerald-accent); font-weight: 700;">${index === activeIndex ? '👁️ Viewing' : 'View'}</span>`;

        row.innerHTML = `
          <img src="${encodeURI(item.src)}" alt="${item.title}" class="pic-queue-thumb" style="${isCurrentlyLocked ? 'filter: blur(3px) brightness(0.5);' : ''}" onerror="this.style.opacity='0.4';">
          <div class="pic-queue-meta">
            <span class="pic-queue-title" style="font-size: 0.95rem;">${index + 1}. ${item.title}</span>
            <span class="pic-queue-tag" style="font-size: 0.76rem;">${isCurrentlyLocked ? '🔒 Members Only' : item.tag}</span>
          </div>
          ${lockBadge}
        `;
        container.appendChild(row);
      });
    }

      document.getElementById('still-active-tag').innerText = `${pic.tag} • Selection #${index + 1} (Click Picture to Enlarge)`;
      renderPictureList('still-list-container', stillPictureLibrary, activeStillIndex, selectStillPicture);
    }

    // FEDERAL HOLIDAY CALENDAR RENDERING
    const federalHolidays = [
      { name: "Labor Day", date: new Date("2026-09-07T00:00:00") },
      { name: "Columbus Day / Indigenous Peoples' Day", date: new Date("2026-10-12T00:00:00") },
      { name: "Veterans Day", date: new Date("2026-11-11T00:00:00") },
      { name: "Thanksgiving Day", date: new Date("2026-11-26T00:00:00") },
      { name: "Christmas Day", date: new Date("2026-12-25T00:00:00") },
      { name: "New Year's Day", date: new Date("2027-01-01T00:00:00") },
      { name: "Martin Luther King Jr. Day", date: new Date("2027-01-18T00:00:00") },
      { name: "Washington's Birthday (Presidents' Day)", date: new Date("2027-02-15T00:00:00") },
      { name: "Memorial Day", date: new Date("2027-05-31T00:00:00") },
      { name: "Juneteenth National Independence Day", date: new Date("2027-06-19T00:00:00") },
      { name: "Independence Day", date: new Date("2027-07-04T00:00:00") }
    ];

    function renderHolidayCalendar() {
      const tbody = document.getElementById('holiday-calendar-rows');
      if (!tbody) return;
      tbody.innerHTML = '';
      
      const nowMs = new Date().getTime();
      const sortedHolidays = [...federalHolidays].sort((a, b) => {
        const diffA = a.date.getTime() - nowMs;
        const diffB = b.date.getTime() - nowMs;
        if (diffA >= 0 && diffB >= 0) return diffA - diffB;
        if (diffA < 0 && diffB >= 0) return 1;
        if (diffA >= 0 && diffB < 0) return -1;
        return diffB - diffA;
      });

      sortedHolidays.forEach((h, index) => {
        const d = new Date(h.date);
        const prepStart = new Date(d); prepStart.setDate(d.getDate() - 3);
        const prepEnd = new Date(d); prepEnd.setDate(d.getDate() - 1);
        const followStart = new Date(d); followStart.setDate(d.getDate() + 1);
        const followEnd = new Date(d); followEnd.setDate(d.getDate() + 3);

        const isNextUpcoming = index === 0;
        const row = document.createElement('tr');
        if (isNextUpcoming) row.className = 'active-fast-row';

        row.innerHTML = `
          <td><strong>${h.name}</strong> ${isNextUpcoming ? '<span style="font-size:0.75rem; background:var(--emerald-accent); color:#000; padding:2px 6px; border-radius:4px; margin-left:6px; font-weight:800;">NEXT UP</span>' : ''}</td>
          <td style="color: var(--gold-accent); font-weight: 700;">${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</td>
          <td style="color: var(--text-muted);">${prepStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – ${prepEnd.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</td>
          <td style="color: var(--text-muted);">${followStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – ${followEnd.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</td>
          <td style="color: var(--emerald-accent); font-weight: 700;">${prepStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – ${followEnd.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function exportFastCalendarICS() {
      let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//ImanI Movement//Holiday Economic Fast//EN\n";
      federalHolidays.forEach(h => {
        const start = new Date(h.date); start.setDate(start.getDate() - 3);
        const end = new Date(h.date); end.setDate(end.getDate() + 4);
        const formatDate = (date) => date.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
        icsContent += "BEGIN:VEVENT\n";
        icsContent += `SUMMARY:ImanI 7-Day Economic Fast — ${h.name}\n`;
        icsContent += `DESCRIPTION:3+1+3 Silent Solution Economic Fast for ${h.name}.\n`;
        icsContent += `DTSTART:${formatDate(start)}\n`;
        icsContent += `DTEND:${formatDate(end)}\n`;
        icsContent += "END:VEVENT\n";
      });
      icsContent += "END:VCALENDAR";

      const blob = new Blob([icsContent], { type: "text/calendar;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", "ImanI_Economic_Fast_Schedule.ics");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (isEditModeActive()) document.body.classList.add("admin-mode");

      renderPlaylistItems();
      renderStreamArchive();
      
      // BOTH GALLERY QUEUE RENDERERS AND CALENDAR RENDERER FULLY WIRED
      renderPictureList('boycott-list-container', boycottPictureLibrary, activeBoycottIndex, selectBoycottPicture);
      renderPictureList('still-list-container', stillPictureLibrary, activeStillIndex, selectStillPicture);
      renderHolidayCalendar();

      const savedEmblem = localStorage.getItem('imani_header_emblem');
      if (savedEmblem) {
        const img = document.getElementById('header-emblem-view');
        if (img) { img.src = savedEmblem; img.style.display = 'block'; }
      }

      const standbyVideo = document.getElementById('standby-motion-player');
      if (standbyVideo) standbyVideo.play().catch(() => {});
      setTimeout(connectLiveStream, 1000);
    });
  </script>
