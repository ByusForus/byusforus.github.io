<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>ImanI — Live Stage, Cultural Vault & Doctrine</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ImanI">

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <style>
    :root {
      --onyx-deep: #000000;
      --onyx-surface: rgba(14, 14, 14, 0.94);
      --onyx-card: rgba(22, 22, 22, 0.92);
      --onyx-border: #222624;
      --emerald-accent: #00D06C;
      --emerald-glow: rgba(0, 208, 108, 0.25);
      --gold-accent: #FFD15C;
      --gold-glow: rgba(255, 209, 92, 0.2);
      --purple-accent: #A855F7;
      --purple-glow: rgba(168, 85, 247, 0.3);
      --text-main: #F4F6F5;
      --text-muted: #9BA8A1;
      --radius-sm: 8px;
      --radius-md: 14px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      padding-bottom: 60px;
      min-height: 100vh;
      background: #000000;
    }

    .admin-only { display: none !important; }
    body.admin-mode .admin-only { display: inline-flex !important; }

    .admin-indicator-bar {
      display: none; background: #7a1515; color: #fff; text-align: center;
      padding: 8px; font-size: 0.85rem; font-weight: 700; position: sticky; top: 0; z-index: 102;
    }
    body.admin-mode .admin-indicator-bar { display: block; }

    /* TOP BANNER */
    .pause-banner {
      background: #000000; border-bottom: 2px solid var(--gold-accent);
      padding: 16px 24px; position: relative; z-index: 101; box-shadow: 0 4px 25px var(--gold-glow);
    }
    .pause-content {
      max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap;
      justify-content: space-between; align-items: center; gap: 18px;
    }
    .pause-text-wrap { display: flex; align-items: center; gap: 14px; }
    .pause-indicator {
      width: 14px; height: 14px; border-radius: 50%; background: var(--gold-accent);
      box-shadow: 0 0 12px var(--gold-accent); animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
    .pause-title { font-weight: 800; font-size: 1.15rem; color: var(--gold-accent); text-transform: uppercase; }
    .pause-subtitle { font-size: 1.05rem; color: var(--gold-accent); font-weight: 800; margin-top: 4px; }
    .countdown-display { display: flex; align-items: center; gap: 10px; }
    .countdown-unit {
      background: var(--onyx-surface); border: 1.5px solid var(--emerald-accent);
      border-radius: 8px; padding: 6px 12px; text-align: center; min-width: 58px;
    }
    .countdown-val { font-weight: 900; font-size: 1.35rem; color: var(--emerald-accent); line-height: 1.1; }
    .countdown-lbl { font-size: 0.72rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }

    .fast-guidance-bar {
      max-width: 1200px; margin: 16px auto 4px auto; background: rgba(18, 18, 18, 0.98);
      border: 2px solid var(--emerald-accent); border-radius: var(--radius-md); padding: 16px 22px; 
      display: flex; align-items: center; gap: 18px; box-shadow: 0 0 20px var(--emerald-glow);
    }
    .guidance-phase-badge {
      background: #000000; border: 1.5px solid var(--gold-accent); color: var(--gold-accent);
      font-size: 0.92rem; font-weight: 900; padding: 8px 16px; border-radius: 6px; text-transform: uppercase; white-space: nowrap;
    }
    .guidance-body { font-size: 1.12rem; color: var(--text-main); line-height: 1.55; }
    .guidance-body strong { color: var(--emerald-accent); font-weight: 800; }

    /* SIGNATURE BLACK BOX DOCTRINE CARDS */
    .doctrine-card {
      background: var(--onyx-surface); 
      border: 2px solid var(--gold-accent);
      border-radius: var(--radius-md); 
      padding: 34px 38px;
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.8), 0 0 25px var(--gold-glow);
      backdrop-filter: blur(14px);
    }

    .button-matrix { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
    .doctrine-btn {
      background: var(--onyx-card); border: 1.5px solid var(--onyx-border); color: var(--text-main);
      padding: 12px 20px; border-radius: var(--radius-sm); font-size: 0.96rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; gap: 10px; transition: all 0.2s ease;
    }
    .doctrine-btn span.badge { color: var(--gold-accent); font-size: 0.82rem; font-weight: 900; }
    .doctrine-btn:hover { border-color: var(--emerald-accent); background: rgba(0, 208, 108, 0.14); transform: translateY(-2px); }
    .doctrine-btn.active { border-color: var(--gold-accent); background: rgba(255, 209, 92, 0.18); color: var(--gold-accent); box-shadow: 0 0 14px var(--gold-glow); }

    .revelation-box {
      background: linear-gradient(145deg, rgba(14, 14, 14, 0.98), rgba(20, 24, 22, 0.96));
      border: 2.5px solid var(--emerald-accent); border-radius: var(--radius-md); padding: 34px 38px;
      box-shadow: 0 8px 35px rgba(0, 0, 0, 0.85), 0 0 30px var(--emerald-glow); transition: opacity 0.2s ease;
    }
    .rev-header-wrap { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; gap: 16px; }
    .rev-tag { font-size: 0.95rem; font-weight: 900; color: var(--emerald-accent); letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 6px; }
    .rev-title { font-size: 1.85rem; font-weight: 900; color: var(--gold-accent); text-shadow: 0 0 15px var(--gold-glow); line-height: 1.25; }
    .rev-content { font-size: 1.25rem; color: var(--text-main); line-height: 1.85; }

    .btn-audio-narrate {
      background: var(--onyx-card); border: 1.5px solid var(--gold-accent); color: var(--gold-accent);
      padding: 10px 20px; border-radius: 24px; font-size: 0.9rem; font-weight: 800; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; box-shadow: 0 0 10px var(--gold-glow);
    }
    .btn-audio-narrate:hover { background: var(--gold-accent); color: #000; }

    .restitution-stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px; margin-top: 22px; padding-top: 22px; border-top: 1.5px solid var(--onyx-border);
    }
    .stat-pill {
      background: var(--onyx-card); border: 1.5px solid var(--onyx-border);
      border-radius: var(--radius-sm); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;
    }
    .stat-label { font-size: 0.78rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.06em; font-weight: 700; }
    .stat-value { font-size: 1.25rem; font-weight: 900; color: var(--emerald-accent); }
    .stat-value.gold { color: var(--gold-accent); }

    /* PICTURE GALLERY STYLING */
    .vault-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 860px) { .vault-grid { grid-template-columns: 1fr; } }

    .picture-viewer-card { background: var(--onyx-surface); border: 1.5px solid var(--onyx-border); border-radius: var(--radius-md); overflow: hidden; display: flex; flex-direction: column; position: relative; }
    .picture-viewer-img { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; cursor: pointer; display: block; border-bottom: 1.5px solid var(--onyx-border); }
    .picture-viewer-details { padding: 16px 20px; display: flex; flex-direction: column; gap: 6px; }
    .picture-viewer-title { font-size: 1.15rem; font-weight: 800; color: var(--text-main); }
    .picture-viewer-tag { font-size: 0.78rem; font-weight: 700; color: var(--emerald-accent); text-transform: uppercase; }

    .playlist-card { background: var(--onyx-surface); border: 1.5px solid var(--onyx-border); border-radius: var(--radius-md); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .audio-tabs-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; border-bottom: 1.5px solid var(--onyx-border); padding-bottom: 12px; justify-content: space-between; align-items: center; }
    .playlist-items-scroll { display: flex; flex-direction: column; gap: 10px; max-height: 480px; overflow-y: auto; padding-right: 4px; }
    
    .pic-queue-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: var(--radius-sm); background: var(--onyx-card); border: 1.5px solid transparent; cursor: pointer; transition: all 0.2s ease; }
    .pic-queue-item:hover, .pic-queue-item.active { border-color: var(--gold-accent); background: rgba(255,209,92,0.1); }
    .pic-queue-thumb { width: 68px; height: 48px; object-fit: cover; border-radius: 6px; background: #000; flex-shrink: 0; border: 1.5px solid var(--onyx-border); }
    .pic-queue-meta { display: flex; flex-direction: column; gap: 3px; overflow: hidden; flex: 1; }
    .pic-queue-title { font-size: 1.05rem; font-weight: 800; color: var(--gold-accent); }
    .pic-queue-tag { font-size: 0.8rem; color: var(--text-muted); }

    /* UNIFIED GOLD BAR TAB BUTTONS */
    .audio-tab-btn, .filter-tag-btn {
      background: linear-gradient(135deg, #3d2f00 0%, #b8860b 25%, #ffd700 50%, #daa520 75%, #2a2000 100%);
      border: 2px solid #ffea85;
      color: #000000;
      font-size: 0.82rem;
      font-weight: 900;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.35), inset 0 2px 3px rgba(255, 255, 255, 0.6), inset 0 -2px 3px rgba(0, 0, 0, 0.6);
      transition: all 0.2s ease;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.4);
    }
    .audio-tab-btn:hover, .filter-tag-btn:hover {
      background: linear-gradient(135deg, #574300 0%, #d4af37 25%, #ffe97d 50%, #f0e68c 75%, #3d2f00 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.8), inset 0 -2px 3px rgba(0, 0, 0, 0.5);
    }
    .audio-tab-btn.active, .filter-tag-btn.active {
      background: linear-gradient(135deg, #ffffff 0%, #ffd700 30%, #ffa500 70%, #b8860b 100%);
      border-color: #ffffff;
      color: #000000;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.7), inset 0 2px 5px rgba(255, 255, 255, 0.9), inset 0 -2px 4px rgba(0, 0, 0, 0.4);
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
      font-weight: 900;
    }

    /* EMERALD GEM AUDIO PLAYER CONTROL BUTTONS & DRAW CARD BUTTON */
    .playback-toggle-btn, .btn-audio-skip, .btn-draw-card {
      background: linear-gradient(135deg, #00381f 0%, #007a3d 25%, #00d06c 50%, #00a854 75%, #002212 100%);
      border: 2px solid #7effb5;
      color: #ffffff;
      font-size: 0.88rem;
      font-weight: 800;
      padding: 10px 22px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0, 208, 108, 0.35), inset 0 2px 3px rgba(255, 255, 255, 0.4), inset 0 -2px 3px rgba(0, 0, 0, 0.6);
      transition: all 0.2s ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .playback-toggle-btn:hover, .btn-audio-skip:hover, .btn-draw-card:hover {
      background: linear-gradient(135deg, #004d2a 0%, #00994d 25%, #2af598 50%, #00c
